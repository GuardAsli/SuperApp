# Include from http {} context: include /opt/guardasli/deploy/nginx/guardasli-map.conf;
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=ga_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ga_auth:10m rate=5r/s;
